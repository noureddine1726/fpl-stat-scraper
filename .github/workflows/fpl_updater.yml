name: FPL Weekly Auto-Scraper

on:
  schedule:
    - cron: '0 10 * * 4' # يعمل كل يوم خميس الساعة 10:00 صباحاً بتوقيت UTC
  workflow_dispatch:

# Autorisation stricte d'écriture pour le robot
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FPL Optimizer
        run: python fpl_optimizer.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add *.csv
          git diff --staged --quiet || (git commit -m "Mise à jour automatique des stats FPL" && git push)