name: FPL Weekly Auto-Scraper

on:
  schedule:
    - cron: '0 10 * * 4'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: pip install -r requirements.txt
    - run: python fpl_optimizer.py
    - run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add *.csv
        git commit -m "Mise à jour automatique des stats FPL" || echo "Aucune modification"
        git push origin master
